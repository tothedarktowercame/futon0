# /etc/tmpfiles.d/tmp.conf: once /tmp is RAM, age out leftovers so test fixtures do not
# fill memory between reboots. Agency and session state is excluded by name.
q /tmp 1777 root root 3d
x /tmp/futon*
x /tmp/.futon*
x /tmp/tmux-*
x /tmp/.X11-unix
x /tmp/emacs*
x /tmp/claude-*
x /tmp/hsperfdata_*
x /tmp/.java_pid*
x /tmp/sqlite-*
x /tmp/invoke-trace.log
x /tmp/promise-chains*
x /tmp/substrate2-byns-*
